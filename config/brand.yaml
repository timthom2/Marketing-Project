# Tone Requirements
tone_requirements:
  phrasing_norms:
    - "your loved one"
    - "aging with dignity"
    - "independence and safety"
    - "white-glove care"
    - "premium home care"
    - "personalized care plan"
    - "expert caregivers"
    - "age in place"
    - "thrive at home"
    - "peace of mind"
  cadence: warm, professional, empathetic
  structure:
    - deck_subheadline
    - skimmable_h2s
    - bullet_lists
    - faq_section
    - inline_local_resources
  cta_vibe: helpful_invitation
  voice_characteristics:
    - "Empathetic and understanding"
    - "Professional yet approachable"
    - "Solution-focused"
    - "Respectful of family decisions"
    - "Supportive and non-judgmental"
    - "Clear and accessible"
  
  # Effective opening patterns (specific, not generic)
  effective_opening_patterns:
    scene: "Picture this: [specific scenario with emotional detail]"
    question: "[Compelling question that challenges assumptions]?"
    statistic: "[Surprising statistic from source] — and here's what it means for [city] families"
  
  paragraph_structure:
    - "Lead with a specific scenario, statistic, or insight (never generic statements)"
    - "Support with evidence from Canadian sources (cite in text)"
    - "Include actionable next steps the reader can take today"
    - "Connect to local context (provincial healthcare, local programs)"
    - "End with forward momentum toward a solution"
  
  statistical_citation_style:
    - "According to the Canadian Institute for Health Information (CIHI)..."
    - "Statistics Canada reports that..."
    - "[Province] Health data shows..."
    - "Research from [University/Organization] indicates..."
    - "(Source: [Organization], [Year])"

# Canadian English Requirements
canadian_requirements:
  spelling_guide:
    mandatory_replacements:
      - ["color", "colour"]
      - ["center", "centre"]
      - ["behavior", "behaviour"]
      - ["theater", "theatre"]
      - ["defense", "defence"]
      - ["organize", "organise"]
      - ["recognize", "recognise"]
      - ["analyze", "analyse"]
      - ["optimize", "optimise"]
      - ["specialize", "specialise"]
      - ["realize", "realise"]
      - ["finalize", "finalise"]
      - ["prioritize", "prioritise"]
      - ["categorize", "categorise"]
      - ["memorize", "memorise"]
    word_choices:
      - ["home health care", "home care"]
      - ["healthcare", "health care"]
      - ["eldercare", "elder care"]
  healthcare_context: "reference provincial healthcare systems by name"
  org_preference: "prioritize Canadian organizations and data sources over US sources"
  terminology:
    - "Use 'home care' not 'home health care'"
    - "Reference provincial health authorities by full name"
    - "Use Canadian dollar amounts (CAD $ or $)"
    - "Reference Canadian programs by name"
    - "Use Canadian spelling throughout"
  provincial_references:
    ontario:
      - "OHIP (Ontario Health Insurance Plan)"
      - "Home and Community Care Support Services (HCCSS)"
      - "Ontario Seniors Care at Home Tax Credit"
    quebec:
      - "RAMQ (Régie de l'assurance maladie du Québec)"
      - "CLSC (Centres locaux de services communautaires)"
    manitoba:
      - "Manitoba Health"
      - "Winnipeg Regional Health Authority (WRHA)"
      - "Manitoba Home Care Program"
    alberta:
      - "Alberta Health Services (AHS)"
      - "Alberta Health Care Insurance Plan (AHCIP)"
      - "AHS Continuing Care"
    british_columbia:
      - "Medical Services Plan (MSP)"
      - "Vancouver Coastal Health (VCH)"
      - "Fraser Health Authority"
      - "Island Health"
      - "Choice in Supports for Independent Living (CSIL)"

