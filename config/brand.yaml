# Content Guidelines
content_guidelines:
  word_count:
    min: 1000
    max: 1400
  local_resources:
    placement: "inline"
    min_links: 2
    max_links: 5
    inline_weaving: true
    no_detached_blocks: true
  faqs:
    count: 5
    unique_across_markets: 4
  callout_boxes:
    count: 1
    style: light_gold
  h2_sections:
    min: 4
    max: 6
    min_unique_per_market: 2
    should_include_bullets: true
  seo_requirements:
    primary_keyword_in_h1: true
    primary_keyword_density: "1.5-2.5%"
    secondary_keywords_naturally_placed: true
    internal_links_min: 2
    external_links_min: 2
    meta_title_max_chars: 60
    meta_title_no_ellipsis: true
    meta_title_keyword_early: true
    meta_description_min_chars: 150
    meta_description_max_chars: 160
    meta_description_has_keyword: true

# Anti-Sameness Rules
anti_sameness:
  # H2 uniqueness requirements
  h2_uniqueness:
    min_unique_percent: 50
    market_specific_h2_required: true
    seed_h2s_from_market_config: true
  
  # FAQ uniqueness requirements
  faq_uniqueness:
    min_unique_vs_other_markets: 4
    total_faqs: 5
  
  # Story lead rotation (unique per market in run)
  story_lead_rotation:
    enforce_unique_per_market: true
    types:
      - scene
      - question
      - statistic
  
  # Primary keyword uniqueness
  keyword_uniqueness:
    no_duplicate_primary_in_run: true
    secondary_must_materially_differ: true
  
  # Banned openers (fail if found)
  banned_openers:
    - "Many families"
    - "As we age"
    - "In today's world"
    - "It's no secret that"
    - "When it comes to"
    - "There's no doubt that"
    - "In recent years"
    - "As we all know"
    - "For many people"
    - "It goes without saying"
    - "In this article"
    - "Today, we will"
  
  # Banned phrases anywhere in body
  banned_phrases:
    - "accessed on"  # Without URL
    - "click here"
    - "read more"
    - "this article"
    - "in conclusion"

# Required Elements (fail if missing)
required_elements:
  statistics:
    min_count: 2
    require_source_url: true
    require_inline_citation: true
  
  local_authority_links:
    min_count: 1
    types:
      - provincial_government
      - health_authority
      - municipal
  
  faq_section:
    required: true
    min_questions: 5
  
  internal_links:
    min_count: 2
    include_location_page: true
    include_service_page: true
  
  external_links:
    min_count: 2
    must_be_authoritative: true
  
  meta:
    title_required: true
    description_required: true

# Image Requirements
image_requirements:
  query_must_include_city: true
  unique_image_per_market: true
  unique_alt_text_per_market: true
  fallback_by_province:
    ontario: ["Toronto", "Ontario", "Canadian city winter", "senior home safety"]
    quebec: ["Montreal", "Quebec", "Canadian city", "elderly care"]
    british_columbia: ["Vancouver", "BC", "Pacific Northwest", "senior wellness"]
    alberta: ["Calgary", "Alberta", "Rocky Mountains", "senior safety"]
    manitoba: ["Winnipeg", "Manitoba", "Canadian prairie", "elderly support"]

# Quality Thresholds for Run Validation
quality_thresholds:
  min_word_count: 1000
  max_word_count: 1400
  min_local_links: 1
  min_cited_stats: 2
  min_internal_links: 2
  min_external_links: 2
  faq_required: true
  faq_min_questions: 5
  meta_title_max_chars: 60
  meta_description_min_chars: 150
  meta_description_max_chars: 160
  keyword_density_min: 1.5
  keyword_density_max: 2.5
  h2_unique_percentage: 50
  fail_on_banned_opener: true
  fail_on_missing_stat: true
  fail_on_missing_faq: true
