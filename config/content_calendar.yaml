version: "3.0"
start_date: "2026-01-06"

# 12-week rotation with enriched local hooks, must-includes, and theme-specific content
rotation_schedule:
  week_1:
    theme: new_year_care_planning
    description: "New Year, New Care Plan - Annual care reviews, goal setting, and planning for aging in place"
    seasonal_context: "Early January - New Year planning"
    target_dates: "Jan 1-7"
    
    local_hook_types:
      - "Provincial funding announcements for home care"
      - "Health authority care coordination updates"
      - "New Year senior wellness programs"
    
    local_angle_examples:
      QC: "Quebec's CLSC home care assessment wait times and how to prepare"
      ON: "Ontario's Home Care Modernization updates for 2026"
      BC: "BC Home and Community Care eligibility changes"
      MB: "Manitoba Home Care Program new year intake process"
      AB: "Alberta Continuing Care connection services"
    
    must_include:
      - "Cite a provincial home care program by name"
      - "Include statistic on seniors preferring to age at home (with source)"
      - "Reference local health authority assessment process"
    
    cta_focus: "getting-started"
    cta_intent: "care assessment"
    
    theme_keywords:
      long_tail:
        - "annual senior care plan review {city}"
        - "home care assessment {province} 2026"
        - "aging in place planning {city}"
        - "senior care goals new year"
        - "{health_authority} home care eligibility"
        - "family care planning meeting guide"
    
    research_checklist:
      - "Find current provincial home care wait time data"
      - "Identify recent health authority announcements"
      - "Locate new year senior wellness programs in market"
      - "Find current care plan review best practices"

  week_2:
    theme: winter_safety
    description: "Winter Safety for Seniors - Falls prevention, hypothermia, heating safety"
    seasonal_context: "Mid-January - Deep winter, extreme cold"
    target_dates: "Jan 8-14"
    
    local_hook_types:
      - "Provincial cold weather health advisories"
      - "Municipal winter safety programs for seniors"
      - "Health authority fall prevention initiatives"
    
    local_angle_examples:
      QC: "Quebec's Info-Santé 811 winter health guidance"
      ON: "Ontario Telehealth cold weather advisories"
      BC: "BC CDC winter safety recommendations for seniors"
      MB: "Manitoba Hydro heating assistance for seniors"
      AB: "Alberta Health Services cold weather alerts"
    
    must_include:
      - "Cite fall statistics for seniors in winter (with source)"
      - "Reference provincial heating assistance program"
      - "Include hypothermia prevention checklist"
    
    cta_focus: "hospital-to-home"
    cta_intent: "fall recovery support"
    
    theme_keywords:
      long_tail:
        - "senior fall prevention {city} winter"
        - "hypothermia signs elderly {province}"
        - "heating assistance seniors {city}"
        - "winter home safety checklist seniors"
        - "{health_authority} fall prevention program"
        - "ice and snow safety tips elderly"
    
    research_checklist:
      - "Find current winter fall injury statistics for province"
      - "Locate provincial heating assistance programs"
      - "Identify health authority winter safety resources"
      - "Find municipal snow clearing accessibility info"

  week_3:
    theme: winter_isolation
    description: "Combating Winter Isolation - Social connection, mental health, companionship"
    seasonal_context: "Late January - Long dark winter, isolation peaks"
    target_dates: "Jan 15-21"
    
    local_hook_types:
      - "Senior social programs and community centres"
      - "Mental health resources for isolated seniors"
      - "Volunteer visitor programs in region"
    
    local_angle_examples:
      QC: "Quebec seniors' community centres (Centres communautaires) programs"
      ON: "Ontario Seniors Community Grant Program activities"
      BC: "BC Better at Home program social supports"
      MB: "Age-Friendly Manitoba community connection initiatives"
      AB: "Alberta Seniors and Housing community programs"
    
    must_include:
      - "Cite loneliness/isolation statistics for Canadian seniors (with source)"
      - "Reference local community centre or social program"
      - "Include companionship care benefits"
    
    cta_focus: "companion-care"
    cta_intent: "companionship and social support"
    
    theme_keywords:
      long_tail:
        - "senior loneliness {city} winter"
        - "companion care services {city}"
        - "elderly social isolation {province}"
        - "senior community programs {city}"
        - "volunteer visitor programs elderly {city}"
        - "mental health support seniors {province}"
    
    research_checklist:
      - "Find current senior isolation statistics for province"
      - "Locate community social programs in market"
      - "Identify volunteer visitor organizations"
      - "Find mental health resources for seniors"

  week_4:
    theme: dementia_awareness
    description: "Dementia Care Focus - Alzheimer's support, memory care, family strategies"
    seasonal_context: "Late January/Early February - Year-round critical topic"
    target_dates: "Jan 22-28"
    
    local_hook_types:
      - "Alzheimer Society local chapter programs"
      - "Provincial dementia strategy updates"
      - "Health authority memory clinic services"
    
    local_angle_examples:
      QC: "Fédération québécoise des Sociétés Alzheimer programs"
      ON: "Ontario Dementia Strategy and local support services"
      BC: "BC Alzheimer Society First Link navigation"
      MB: "Alzheimer Society of Manitoba caregiver support"
      AB: "Alberta Dementia Strategy and community resources"
    
    must_include:
      - "Cite dementia prevalence statistics for Canada (with source)"
      - "Reference local Alzheimer Society program by name"
      - "Include family caregiver support resources"
    
    cta_focus: "dementia"
    cta_intent: "specialized dementia care"
    
    theme_keywords:
      long_tail:
        - "dementia care at home {city}"
        - "Alzheimer's support {city}"
        - "memory care services {city}"
        - "{health_authority} memory clinic"
        - "dementia caregiver support {province}"
        - "early dementia signs elderly"
    
    research_checklist:
      - "Find current dementia statistics for province"
      - "Locate Alzheimer Society chapter programs"
      - "Identify health authority memory clinics"
      - "Find caregiver support group information"

  week_5:
    theme: heart_health
    description: "Heart Health Month - Cardiac care, heart disease management, recovery"
    seasonal_context: "February - Heart Month in Canada, cold weather cardiac risks"
    target_dates: "Jan 29 - Feb 4"
    
    local_hook_types:
      - "Heart and Stroke Foundation local programs"
      - "Provincial cardiac rehabilitation services"
      - "Health authority heart health initiatives"
    
    local_angle_examples:
      QC: "Quebec cardiac rehabilitation through CLSC network"
      ON: "Cardiac Care Network of Ontario resources"
      BC: "BC Cardiac Services cardiac rehabilitation"
      MB: "Reh-Fit Centre cardiac rehabilitation Winnipeg"
      AB: "TotalCardiology cardiac rehab Calgary"
    
    must_include:
      - "Cite heart disease statistics for Canadian seniors (with source)"
      - "Reference Heart and Stroke Foundation program"
      - "Include post-cardiac surgery home care information"
    
    cta_focus: "heart-health"
    cta_intent: "cardiac care support"
    
    theme_keywords:
      long_tail:
        - "cardiac care at home {city}"
        - "post heart surgery recovery {city}"
        - "heart health seniors {province}"
        - "{health_authority} cardiac rehabilitation"
        - "heart disease home care support"
        - "cardiovascular wellness elderly"
    
    research_checklist:
      - "Find current heart disease statistics for seniors"
      - "Locate cardiac rehabilitation programs in market"
      - "Identify Heart and Stroke local initiatives"
      - "Find cold weather cardiac risk information"

  week_6:
    theme: valentines_companionship
    description: "Valentine's Day - Companionship, emotional support, preventing loneliness"
    seasonal_context: "Mid-February - Valentine's Day (Feb 14)"
    target_dates: "Feb 5-14"
    
    local_hook_types:
      - "Senior social events and gatherings"
      - "Intergenerational connection programs"
      - "Valentine's volunteer visitor initiatives"
    
    local_angle_examples:
      QC: "Montreal seniors' Valentine social programs"
      ON: "Toronto seniors' centres Valentine events"
      BC: "Vancouver Park Board seniors' social programs"
      MB: "Winnipeg Age & Opportunity Valentine activities"
      AB: "Calgary Kerby Centre social programs"
    
    must_include:
      - "Cite senior loneliness impact statistics (with source)"
      - "Reference local senior centre or social program"
      - "Include companionship care benefits for emotional wellbeing"
    
    cta_focus: "companion-care"
    cta_intent: "companionship and connection"
    
    theme_keywords:
      long_tail:
        - "senior companionship {city}"
        - "elderly loneliness prevention {city}"
        - "companion care benefits {province}"
        - "senior social programs {city}"
        - "emotional support elderly {city}"
        - "Valentine's Day seniors activities {city}"
    
    research_checklist:
      - "Find Valentine's senior events in market"
      - "Locate companionship statistics research"
      - "Identify intergenerational programs"
      - "Find senior centre social calendars"

  week_7:
    theme: tax_season_prep
    description: "Tax Season Preparation - Medical expense credits, caregiver benefits, deductions"
    seasonal_context: "Late February - Tax preparation (deadline April 30)"
    target_dates: "Feb 15-28"
    
    local_hook_types:
      - "Provincial senior tax credit programs"
      - "Free tax preparation services for seniors"
      - "CRA medical expense updates"
    
    local_angle_examples:
      QC: "Quebec senior tax credits and Revenu Québec resources"
      ON: "Ontario Seniors Care at Home Tax Credit"
      BC: "BC Senior's Home Renovation Tax Credit"
      MB: "Manitoba Primary Caregiver Tax Credit"
      AB: "Alberta seniors benefits and property tax programs"
    
    must_include:
      - "Cite specific provincial tax credit with eligibility"
      - "Reference CRA medical expense eligible items"
      - "Include free tax preparation resources for seniors"
    
    cta_focus: "getting-started"
    cta_intent: "care cost assessment"
    
    theme_keywords:
      long_tail:
        - "home care tax credit {province}"
        - "medical expense deduction elderly care"
        - "caregiver tax benefits {province}"
        - "{province} senior tax credits 2026"
        - "CRA eligible home care expenses"
        - "free tax help seniors {city}"
    
    research_checklist:
      - "Find current provincial tax credit details"
      - "Locate CRA medical expense eligible items list"
      - "Identify free tax preparation for seniors in market"
      - "Find caregiver tax benefit information"

  week_8:
    theme: hospital_to_home
    description: "Post-Hospital Transitions - Safe discharge, recovery at home, readmission prevention"
    seasonal_context: "March - Post-flu season hospital discharges"
    target_dates: "Mar 1-14"
    
    local_hook_types:
      - "Health authority discharge planning services"
      - "Provincial transitional care programs"
      - "Hospital at home initiatives"
    
    local_angle_examples:
      QC: "Quebec CLSC post-hospital home care coordination"
      ON: "Ontario Home and Community Care Support Services transitions"
      BC: "VCH/Fraser Health discharge planning programs"
      MB: "WRHA Bridging Program for hospital transitions"
      AB: "AHS Continuing Care Connection discharge support"
    
    must_include:
      - "Cite hospital readmission statistics (with source)"
      - "Reference health authority discharge program"
      - "Include 30-day post-discharge care checklist"
    
    cta_focus: "hospital-to-home"
    cta_intent: "discharge transition support"
    
    theme_keywords:
      long_tail:
        - "hospital to home care {city}"
        - "post-discharge support {city}"
        - "preventing hospital readmission {province}"
        - "{health_authority} discharge planning"
        - "recovery care at home {city}"
        - "transitional care services {city}"
    
    research_checklist:
      - "Find readmission prevention statistics"
      - "Locate health authority discharge programs"
      - "Identify transitional care services in market"
      - "Find post-discharge checklist resources"

  week_9:
    theme: spring_preparation
    description: "Preparing for Spring - Home safety, thaw hazards, spring cleaning safety"
    seasonal_context: "Mid-March - Thaw begins, slippery conditions"
    target_dates: "Mar 15-31"
    
    local_hook_types:
