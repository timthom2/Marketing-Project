      - "Reference Parkinson Canada program or clinic"
      - "Include daily living support strategies"
    
    cta_focus: "parkinsons"
    cta_intent: "Parkinson's care support"
    
    theme_keywords:
      long_tail:
        - "Parkinson's home care {city}"
        - "movement disorder support {city}"
        - "tremor management elderly {province}"
        - "Parkinson's daily living {city}"
        - "{health_authority} movement disorder clinic"
        - "Parkinson Canada {province} programs"
    
    research_checklist:
      - "Find current Parkinson's statistics for Canada"
      - "Locate Parkinson Canada regional programs"
      - "Identify movement disorder clinics in market"
      - "Find April awareness events"

  week_11:
    theme: stroke_awareness
    description: "Stroke Awareness Month - Stroke recovery, rehabilitation, long-term care"
    seasonal_context: "Late April - Stroke Awareness Month"
    target_dates: "Apr 15-30"
    
    local_hook_types:
      - "Provincial stroke networks"
      - "Heart and Stroke local programs"
      - "Stroke rehabilitation services"
    
    local_angle_examples:
      QC: "Quebec Stroke Network (Réseau québécois de l'AVC)"
      ON: "Ontario Stroke Network rehabilitation services"
      BC: "BC Stroke Services and rehab programs"
      MB: "HSC Winnipeg stroke rehabilitation"
      AB: "Calgary Stroke Program and rehabilitation"
    
    must_include:
      - "Cite stroke statistics for Canadian seniors (with source)"
      - "Reference provincial stroke network or program"
      - "Include stroke recovery timeline information"
    
    cta_focus: "stroke"
