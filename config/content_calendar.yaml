      - "Find stroke awareness month events"

  week_12:
    theme: palliative_care
    description: "Palliative and End-of-Life Care - Comfort care, hospice, family support"
    seasonal_context: "May - National Hospice Palliative Care Week"
    target_dates: "May 1-14"
    
    local_hook_types:
