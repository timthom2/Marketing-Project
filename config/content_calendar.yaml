      - "Cite spring fall injury statistics (with source)"
      - "Reference provincial home modification grant program"
      - "Include spring home safety checklist"
    
    cta_focus: "getting-started"
    cta_intent: "home safety assessment"
    
    theme_keywords:
      long_tail:
        - "spring home safety seniors {city}"
        - "fall prevention thaw season {province}"
        - "senior home modification grants {province}"
        - "spring cleaning safety elderly"
        - "{province} HAFI grants seniors"
        - "home accessibility improvements {city}"
    
    research_checklist:
      - "Find spring injury statistics for seniors"
      - "Locate home modification grant programs"
      - "Identify spring safety resources"
      - "Find municipal accessibility information"

  week_10:
    theme: parkinsons_awareness
    description: "Parkinson's Awareness Month - Movement disorders, tremor management, daily living"
    seasonal_context: "April - Parkinson's Awareness Month"
    target_dates: "Apr 1-14"
    
    local_hook_types:
      - "Parkinson Canada local programs"
      - "Provincial movement disorder clinics"
      - "Parkinson's awareness events"
    
    local_angle_examples:
      QC: "Parkinson Québec regional support groups"
      ON: "Parkinson Canada Ontario education programs"
      BC: "Pacific Parkinson's Research Centre resources"
