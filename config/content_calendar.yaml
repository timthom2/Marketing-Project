      - "Include hospice vs palliative care explanation"
      - "Reference advance care planning resources"
    
    cta_focus: "end-of-life"
    cta_intent: "compassionate end-of-life care"
    
    theme_keywords:
      long_tail:
        - "palliative care at home {city}"
        - "hospice services {city}"
        - "end of life care {province}"
        - "comfort care elderly {city}"
        - "{province} palliative care program"
        - "advance care planning {province}"
    
    research_checklist:
      - "Find palliative care access statistics"
      - "Locate hospice services in market"
      - "Identify advance care planning resources"
      - "Find National Hospice Week events"

# CTA and service page mapping by theme
theme_service_mapping:
  new_year_care_planning: "getting-started"
  winter_safety: "hospital-to-home"
  winter_isolation: "companion-care"
  dementia_awareness: "dementia"
  heart_health: "heart-health"
  valentines_companionship: "companion-care"
  tax_season_prep: "getting-started"
  hospital_to_home: "hospital-to-home"
  spring_preparation: "getting-started"
  parkinsons_awareness: "parkinsons"
  stroke_awareness: "stroke"
  palliative_care: "end-of-life"

# Anti-sameness rules
anti_sameness:
  h2_uniqueness_percent: 50
  faq_unique_vs_other_markets: 4
  unique_story_lead_per_market: true
  story_lead_rotation:
    - scene
    - question
    - statistic
  banned_openers:
    - "Many families"
    - "As we age"
    - "In today's world"
    - "It's no secret"
    - "When it comes to"
    - "There's no doubt"
    - "In recent years"
    - "As we all know"
    - "For many people"
  primary_keyword_unique_per_run: true
